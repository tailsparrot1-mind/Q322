name: Python syntax, UI smoke tests and source package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application and tests
        run: python -m compileall -q main.py vkus tests .github/scripts
      - name: Package current Vkus source
        run: zip -r Vkus-Q322-embedded-board.zip main.py install.sh run.sh requirements.txt README.md vkus data tests
      - uses: actions/upload-artifact@v4
        with:
          name: Vkus-Q322-embedded-board
          path: Vkus-Q322-embedded-board.zip
          if-no-files-found: error

  marketplace-ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app runtime dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install Pillow selenium keyring
      - name: Launch Vkus and test role selection hotspot
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" .venv/bin/python .github/scripts/smoke_marketplace.py
      - uses: actions/upload-artifact@v4
        with:
          name: Vkus-Q322-marketplace-screenshots
          path: artifacts/*
          if-no-files-found: error

  license-store-webview-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install embedded WebView
        run: |
          python -m venv .venv
          .venv/bin/pip install Pillow selenium keyring tkwry==0.1.9
      - name: Launch Vkus desktop app and verify embedded store
        run: xvfb-run -a .venv/bin/python .github/scripts/smoke_license_webview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vkus-Q322-license-store-webview
          path: artifacts/*
          if-no-files-found: warn
